<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Apigee MCP Tool Browser</title>
  <style>
    :root {
      --navy: #002b54;
      --blue: #007dba;
      --teal: #00a9b4;
      --ink: #1a2535;
      --muted: #5a6878;
      --line: #dce3e9;
      --surface: #f5f7fa;
      --white: #fff;
      --success: #00865a;
      --danger: #b42318;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      color: var(--ink);
      background: var(--surface);
      font: 15px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
      min-height: 64px;
      padding: 12px 28px;
      color: var(--white);
      background: var(--navy);
    }
    header h1 { margin: 0; font-size: 19px; letter-spacing: -.01em; }
    header p { margin: 2px 0 0; color: #bfd1df; font-size: 12px; }
    .status { display: inline-flex; align-items: center; gap: 8px; font-size: 13px; }
    .dot { width: 9px; height: 9px; border-radius: 50%; background: #8c9baa; }
    .dot.ok { background: #40c894; box-shadow: 0 0 0 4px rgba(64,200,148,.14); }
    .dot.busy { background: #f4b740; }
    .dot.error { background: #f97066; }
    main { width: min(1100px, calc(100% - 32px)); margin: 28px auto; }
    .connection {
      display: grid;
      grid-template-columns: minmax(260px, 1fr) minmax(220px, .7fr) auto;
      gap: 12px;
      padding: 18px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--white);
    }
    label { display: block; margin-bottom: 6px; color: var(--muted); font-size: 12px; font-weight: 650; }
    input, button {
      min-height: 44px;
      border: 1px solid var(--line);
      border-radius: 5px;
      font: inherit;
    }
    input { width: 100%; padding: 10px 12px; color: var(--ink); background: var(--white); }
    input:focus, button:focus-visible { outline: 3px solid rgba(0,125,186,.2); border-color: var(--blue); }
    button {
      align-self: end;
      padding: 10px 20px;
      color: var(--white);
      border-color: var(--blue);
      background: var(--blue);
      cursor: pointer;
      font-weight: 650;
    }
    button:hover { background: #006ca2; }
    button:disabled { cursor: wait; opacity: .6; }
    .toolbar { display: flex; align-items: center; justify-content: space-between; gap: 16px; margin: 26px 0 12px; }
    .toolbar h2 { margin: 0; font-size: 18px; }
    .count { color: var(--muted); font-size: 13px; }
    .message {
      margin-top: 14px;
      padding: 11px 13px;
      border-radius: 5px;
      background: #eef6fa;
      color: #075a81;
      font-size: 13px;
    }
    .message.error { color: var(--danger); background: #fff0ee; }
    .tools { display: grid; gap: 12px; }
    .tool {
      display: grid;
      grid-template-columns: minmax(180px, .42fr) 1fr;
      gap: 22px;
      padding: 20px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--white);
    }
    .tool-name {
      margin: 0;
      color: var(--navy);
      font: 650 14px/1.4 ui-monospace, SFMono-Regular, Menlo, monospace;
      overflow-wrap: anywhere;
    }
    .tool-description { margin: 0 0 12px; color: var(--muted); }
    details { border-top: 1px solid var(--line); padding-top: 10px; }
    summary { color: var(--blue); cursor: pointer; font-size: 13px; font-weight: 650; }
    .call-panel {
      display: grid;
      gap: 10px;
      margin-top: 16px;
      padding-top: 16px;
      border-top: 1px solid var(--line);
    }
    .call-panel textarea {
      width: 100%;
      min-height: 150px;
      resize: vertical;
      padding: 12px;
      border: 1px solid var(--line);
      border-radius: 5px;
      color: var(--ink);
      background: #fbfcfd;
      font: 12px/1.55 ui-monospace, SFMono-Regular, Menlo, monospace;
    }
    .call-panel textarea:focus { outline: 3px solid rgba(0,125,186,.2); border-color: var(--blue); }
    .call-actions { display: flex; align-items: center; gap: 12px; }
    .call-actions button { min-height: 40px; padding: 8px 16px; }
    .call-state { color: var(--muted); font-size: 12px; }
    .tool-result { margin-top: 0; }
    pre {
      max-height: 340px;
      overflow: auto;
      margin: 12px 0 0;
      padding: 14px;
      border-radius: 5px;
      color: #dceaf4;
      background: #102b40;
      font: 12px/1.55 ui-monospace, SFMono-Regular, Menlo, monospace;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
    }
    .empty {
      padding: 48px 20px;
      border: 1px dashed #b7c2cc;
      border-radius: 8px;
      color: var(--muted);
      background: var(--white);
      text-align: center;
    }
    @media (max-width: 700px) {
      header { align-items: flex-start; padding: 14px 18px; }
      main { width: min(100% - 20px, 1100px); margin-top: 18px; }
      .connection, .tool { grid-template-columns: 1fr; }
      .connection > button { width: 100%; }
    }
  </style>
</head>
<body>
  <header>
    <div>
      <h1>Apigee MCP Tool Browser</h1>
      <p>Inspect tools exposed by an MCP Discovery Proxy</p>
    </div>
    <div class="status"><span id="statusDot" class="dot"></span><span id="statusText">Not connected</span></div>
  </header>

  <main>
    <section class="connection" aria-label="MCP connection">
      <div>
        <label for="endpoint">MCP endpoint</label>
        <input id="endpoint" type="url" value="https://YOUR_APIGEE_HOSTNAME/mcp" spellcheck="false">
      </div>
      <div>
        <label for="apiKey">API key</label>
        <input id="apiKey" type="password" placeholder="Enter an approved app key" autocomplete="off" spellcheck="false">
      </div>
      <button id="connect" type="button">Connect and list tools</button>
    </section>

    <div id="message" class="message" hidden></div>

    <div class="toolbar">
      <h2>Available tools</h2>
      <span id="count" class="count">0 tools</span>
    </div>
    <section id="tools" class="tools" aria-live="polite">
      <div class="empty">Connect to the MCP endpoint to list its tools.</div>
    </section>
  </main>

  <script>
    const endpoint = document.querySelector('#endpoint');
    const apiKey = document.querySelector('#apiKey');
    const connectButton = document.querySelector('#connect');
    const toolsPanel = document.querySelector('#tools');
    const count = document.querySelector('#count');
    const message = document.querySelector('#message');
    const statusDot = document.querySelector('#statusDot');
    const statusText = document.querySelector('#statusText');

    let requestId = 0;
    let sessionId = null;
    let protocolVersion = '2025-03-26';

    function setStatus(kind, text) {
      statusDot.className = `dot ${kind || ''}`.trim();
      statusText.textContent = text;
    }

    function showMessage(text, isError = false) {
      message.hidden = !text;
      message.textContent = text || '';
      message.className = `message${isError ? ' error' : ''}`;
    }

    function parseMcpResponse(text, contentType) {
      if (!text.trim()) return null;
      if (contentType.includes('text/event-stream')) {
        const events = text.split(/\r?\n/)
          .filter(line => line.startsWith('data:'))
          .map(line => line.slice(5).trim())
          .filter(Boolean)
          .map(line => JSON.parse(line));
        return events.at(-1) || null;
      }
      return JSON.parse(text);
    }

    async function rpc(method, params, notification = false) {
      const headers = {
        'Content-Type': 'application/json',
        'Accept': 'application/json, text/event-stream',
        'MCP-Protocol-Version': protocolVersion
      };
      if (apiKey.value.trim()) headers['x-api-key'] = apiKey.value.trim();
      if (sessionId) headers['Mcp-Session-Id'] = sessionId;

      const payload = { jsonrpc: '2.0', method };
      if (!notification) payload.id = ++requestId;
      if (params !== undefined) payload.params = params;

      const response = await fetch(endpoint.value.trim(), {
        method: 'POST',
        headers,
        body: JSON.stringify(payload)
      });

      sessionId = response.headers.get('Mcp-Session-Id') || sessionId;
      const text = await response.text();
      const data = parseMcpResponse(text, response.headers.get('content-type') || '');

      if (!response.ok) throw new Error(data?.error?.message || text || `HTTP ${response.status}`);
      if (data?.error) throw new Error(data.error.message || JSON.stringify(data.error));
      return data?.result ?? null;
    }

    function resolveSchema(schema, root) {
      if (!schema || typeof schema !== 'object') return {};
      if (!schema.$ref) return schema;
      const path = schema.$ref.replace(/^#\//, '').split('/');
      return path.reduce((value, key) => value?.[key], root) || schema;
    }

    function exampleFromSchema(schema, root, depth = 0) {
      const resolved = resolveSchema(schema, root);
      if (resolved.example !== undefined) return resolved.example;
      if (resolved.default !== undefined) return resolved.default;
      if (depth > 8) return null;

      if (resolved.type === 'object' || resolved.properties) {
        return Object.fromEntries(Object.entries(resolved.properties || {}).map(([key, value]) => [
          key,
          exampleFromSchema(value, root, depth + 1)
        ]));
      }
      if (resolved.type === 'array') return [];
      if (resolved.type === 'integer' || resolved.type === 'number') return resolved.minimum ?? 0;
      if (resolved.type === 'boolean') return false;
      return '';
    }

    function formatResult(result) {
      const text = result?.content?.length === 1 ? result.content[0]?.text : null;
      if (text) {
        try { return JSON.stringify(JSON.parse(text), null, 2); } catch (_) { return text; }
      }
      return JSON.stringify(result, null, 2);
    }

    function renderTools(tools) {
      count.textContent = `${tools.length} tool${tools.length === 1 ? '' : 's'}`;
      if (!tools.length) {
        toolsPanel.innerHTML = '<div class="empty">The server returned no tools.</div>';
        return;
      }

      toolsPanel.replaceChildren(...tools.map(tool => {
        const article = document.createElement('article');
        article.className = 'tool';

        const name = document.createElement('h3');
        name.className = 'tool-name';
        name.textContent = tool.name || 'Unnamed tool';

        const body = document.createElement('div');
        const description = document.createElement('p');
        description.className = 'tool-description';
        description.textContent = tool.description || 'No description provided.';

        const details = document.createElement('details');
        const summary = document.createElement('summary');
        summary.textContent = 'View input schema';
        const schema = document.createElement('pre');
        schema.textContent = JSON.stringify(tool.inputSchema || {}, null, 2);
        details.append(summary, schema);

        const callPanel = document.createElement('div');
        callPanel.className = 'call-panel';
        const argumentsLabel = document.createElement('label');
        argumentsLabel.textContent = 'Tool arguments (JSON)';
        const argumentsInput = document.createElement('textarea');
        argumentsInput.spellcheck = false;
        argumentsInput.value = JSON.stringify(exampleFromSchema(tool.inputSchema || {}, tool.inputSchema || {}), null, 2);

        const actions = document.createElement('div');
        actions.className = 'call-actions';
        const callButton = document.createElement('button');
        callButton.type = 'button';
        callButton.textContent = 'Call tool';
        const callState = document.createElement('span');
        callState.className = 'call-state';
        actions.append(callButton, callState);

        const resultOutput = document.createElement('pre');
        resultOutput.className = 'tool-result';
        resultOutput.hidden = true;

        callButton.addEventListener('click', async () => {
          let argumentsValue;
          try {
            argumentsValue = JSON.parse(argumentsInput.value || '{}');
          } catch (error) {
            callState.textContent = `Invalid JSON: ${error.message}`;
            return;
          }

          callButton.disabled = true;
          callState.textContent = 'Calling…';
          resultOutput.hidden = true;
          try {
            const result = await rpc('tools/call', { name: tool.name, arguments: argumentsValue });
            resultOutput.textContent = formatResult(result);
            resultOutput.hidden = false;
            callState.textContent = result?.isError ? 'Tool returned an error' : 'Completed';
          } catch (error) {
            resultOutput.textContent = error.message;
            resultOutput.hidden = false;
            callState.textContent = 'Call failed';
          } finally {
            callButton.disabled = false;
          }
        });

        callPanel.append(argumentsLabel, argumentsInput, actions, resultOutput);
        body.append(description, details, callPanel);
        article.append(name, body);
        return article;
      }));
    }

    async function connectAndList() {
      if (!apiKey.value.trim()) {
        setStatus('error', 'API key required');
        showMessage('Enter an approved API key before connecting.', true);
        apiKey.focus();
        return;
      }

      connectButton.disabled = true;
      showMessage('');
      setStatus('busy', 'Connecting');
      sessionId = null;

      try {
        const initialized = await rpc('initialize', {
          protocolVersion,
          capabilities: {},
          clientInfo: { name: 'apigee-mcp-tool-browser', version: '1.0.0' }
        });
        protocolVersion = initialized?.protocolVersion || protocolVersion;

        try { await rpc('notifications/initialized', {}, true); } catch (_) { /* stateless servers may not reply */ }
        const result = await rpc('tools/list', {});
        const tools = Array.isArray(result?.tools) ? result.tools : [];
        renderTools(tools);
        setStatus('ok', 'Connected');
        showMessage(`Connected to ${initialized?.serverInfo?.name || 'MCP server'} ${initialized?.serverInfo?.version || ''}`.trim());
      } catch (error) {
        renderTools([]);
        setStatus('error', 'Connection failed');
        showMessage(`Could not list tools: ${error.message}`, true);
      } finally {
        connectButton.disabled = false;
      }
    }

    connectButton.addEventListener('click', connectAndList);
    endpoint.addEventListener('keydown', event => {
      if (event.key === 'Enter') connectAndList();
    });
    apiKey.addEventListener('keydown', event => {
      if (event.key === 'Enter') connectAndList();
    });
  </script>
</body>
</html>

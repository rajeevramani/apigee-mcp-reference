openapi: 3.0.3
info:
  title: Developer Documentation Search Reverse Proxy API
  version: 0.1.0
  license:
    name: Proprietary
  description: >-
    Searches approved API documentation. Results are filtered using the
    authenticated caller's application and API-product entitlements. Caller
    identity and entitlement context are supplied by the platform and are not
    accepted as request parameters.
servers:
  - url: https://YOUR_APIGEE_HOSTNAME/developer-intelligence/v1
    description: >-
      Sandbox reverse-proxy endpoint. The server URL includes the Apigee proxy
      base path; operation paths are relative to that base path.
tags:
  - name: Developer documentation
    description: Search approved API documentation available to the caller.
paths:
  /documentation/search:
    post:
      tags:
        - Developer documentation
      operationId: documentation_search
      summary: Search approved API documentation
      description: >-
        Searches indexed documentation sections using a natural-language query.
        Optionally restricts the search to one API. The service removes results
        for APIs and environments that the authenticated caller is not entitled
        to discover. It never returns Cloud Storage object paths or internal
        repository locations.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DocumentationSearchRequest'
            examples:
              paymentProcessEndpoints:
                summary: Find documentation about payment process endpoints
                value:
                  query: payment process endpoints
                  api_name: payments
                  limit: 5
      responses:
        '200':
          description: Entitlement-filtered documentation matches ordered by relevance.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DocumentationSearchResponse'
              examples:
                matchesFound:
                  value:
                    matches:
                      - api_name: payments
                        document_id: payment-process-api-reference
                        section_id: get-payment-process
                        heading: Retrieve a payment process
                        section_path: API reference / Processes / Retrieve process
                        excerpt: >-
                          Retrieves a payment process using its process identifier.
                        relevance: 0.94
                        portal_url: https://developer.example.com/apis/payments/docs#get-payment-process
                    returned: 1
        '400':
          description: The search request is invalid.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '401':
          description: The caller is not authenticated.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '403':
          description: The caller is not permitted to use documentation search.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '429':
          description: The caller exceeded the applicable quota.
          headers:
            Retry-After:
              description: Number of seconds to wait before retrying.
              schema:
                type: integer
                minimum: 1
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '500':
          description: The documentation search service failed.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
      security:
        - bearerAuth: []
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: >-
        Access token validated by Apigee. The final identity-propagation design
        between the MCP Discovery Proxy and this API must be validated during
        the proof of concept.
  schemas:
    DocumentationSearchRequest:
      type: object
      additionalProperties: false
      required:
        - query
      properties:
        query:
          type: string
          minLength: 2
          maxLength: 500
          description: Natural-language documentation search query.
          example: payment process endpoints
        api_name:
          type: string
          minLength: 1
          maxLength: 100
          pattern: '^[A-Za-z0-9][A-Za-z0-9._-]*$'
          description: >-
            Optional API catalogue name used to restrict the search. This is a
            search filter, not an authorization override.
          example: payments
        limit:
          type: integer
          minimum: 1
          maximum: 20
          default: 5
          description: Maximum number of entitlement-filtered matches to return.
    DocumentationSearchResponse:
      type: object
      additionalProperties: false
      required:
        - matches
        - returned
      properties:
        matches:
          type: array
          maxItems: 20
          items:
            $ref: '#/components/schemas/DocumentationMatch'
        returned:
          type: integer
          minimum: 0
          maximum: 20
          description: Number of matches returned after entitlement filtering.
    DocumentationMatch:
      type: object
      additionalProperties: false
      required:
        - api_name
        - document_id
        - section_id
        - heading
        - excerpt
      properties:
        api_name:
          type: string
          description: API catalogue name.
        document_id:
          type: string
          description: Stable public identifier for the indexed document.
        section_id:
          type: string
          description: Stable identifier that can be used by a future section-retrieval tool.
        heading:
          type: string
          description: Documentation section heading.
        section_path:
          type: string
          description: Human-readable location within the documentation.
        excerpt:
          type: string
          maxLength: 4000
          description: Relevant documentation excerpt with unsafe markup removed.
        relevance:
          type: number
          format: float
          minimum: 0
          maximum: 1
          description: Relative search score for ordering results.
        portal_url:
          type: string
          format: uri
          description: Optional developer-portal URL; never a storage or internal repository URL.
    Problem:
      type: object
      additionalProperties: true
      required:
        - type
        - title
        - status
      properties:
        type:
          type: string
          format: uri-reference
        title:
          type: string
        status:
          type: integer
          minimum: 400
          maximum: 599
        detail:
          type: string
        correlation_id:
          type: string
          description: Safe identifier used to correlate platform logs.

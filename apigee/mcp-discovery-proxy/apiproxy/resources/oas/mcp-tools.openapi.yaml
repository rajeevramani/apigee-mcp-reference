openapi: 3.0.3
info:
  title: Developer Intelligence MCP Tool Source API
  version: 0.1.0
  license:
    name: Apache License 2.0
    url: https://www.apache.org/licenses/LICENSE-2.0.html
  description: >-
    Describes two read-only source operations exposed as MCP tools. In this
    reference implementation, caller authentication and tool entitlement are
    enforced at the MCP Discovery Proxy. The source mocks do not accept caller
    identity or entitlement context as request parameters.
servers:
  - url: https://YOUR_APIGEE_HOSTNAME
    description: >-
      Sandbox Apigee environment-group hostname. Replace this value with the
      exact hostname of the environment group where the MCP Discovery Proxy is
      deployed.
tags:
  - name: Developer documentation
    description: Search approved API documentation available to the caller.
  - name: API catalogue
    description: Discover APIs available to the caller.
security: []
paths:
  /developer-intelligence/v1/documentation/search:
    get:
      tags:
        - Developer documentation
      operationId: documentation_search
      summary: Search approved API documentation
      description: >-
        Use this operation when detailed API documentation is needed. It searches
        indexed documentation sections using a natural-language query and can
        optionally restrict the search to one API. Do not use it merely to
        discover which APIs are available; use api_catalogue_search instead. It
        never returns storage object paths or internal repository locations.
      parameters:
        - name: query
          in: query
          required: true
          description: Natural-language documentation search query.
          example: payment process endpoints
          schema:
            type: string
            minLength: 2
            maxLength: 500
        - name: api_name
          in: query
          required: false
          description: >-
            Optional API catalogue name used to restrict the search. This is a
            search filter, not an authorization override.
          example: payments
          schema:
            type: string
            minLength: 1
            maxLength: 100
            pattern: '^[A-Za-z0-9][A-Za-z0-9._-]*$'
        - name: limit
          in: query
          required: false
          description: Maximum number of matches to return.
          example: 5
          schema:
            type: integer
            minimum: 1
            maximum: 20
            default: 5
      responses:
        '200':
          description: Documentation matches ordered by relevance.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DocumentationSearchResponse'
              examples:
                matchesFound:
                  value:
                    matches:
                      - api_name: payments
                        document_id: payment-process-api-reference
                        section_id: get-payment-process
                        heading: Retrieve a payment process
                        section_path: API reference / Processes / Retrieve process
                        excerpt: >-
                          Retrieves a payment process using its process identifier.
                        relevance: 0.94
                        portal_url: https://developer.example.com/apis/payments/docs#get-payment-process
                    returned: 1
        '400':
          description: The search request is invalid.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '401':
          description: The caller is not authenticated.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '403':
          description: The caller is not permitted to use documentation search.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '429':
          description: The caller exceeded the applicable quota.
          headers:
            Retry-After:
              description: Number of seconds to wait before retrying.
              schema:
                type: integer
                minimum: 1
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '500':
          description: The documentation search service failed.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
  /api-catalogue/v1/search:
    get:
      tags:
        - API catalogue
      operationId: api_catalogue_search
      summary: Search the API catalogue
      description: >-
        Use this operation to discover which APIs or capabilities are available.
        It finds APIs by capability or natural-language query and returns concise
        catalogue metadata. Do not use it for detailed endpoint documentation;
        use documentation_search instead.
      parameters:
        - name: query
          in: query
          required: true
          description: Natural-language capability or API-name search query.
          example: payment APIs
          schema:
            type: string
            minLength: 2
            maxLength: 300
        - name: limit
          in: query
          required: false
          description: Maximum number of catalogue entries to return.
          example: 5
          schema:
            type: integer
            minimum: 1
            maximum: 10
            default: 5
      responses:
        '200':
          description: Matching API catalogue entries ordered by relevance.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiCatalogueSearchResponse'
              example:
                apis:
                  - api_name: payments
                    display_name: Payments API
                    summary: Initiate and track payments.
                    version: v1
                    lifecycle: active
                    documentation_url: https://developer.example.com/apis/payments
                returned: 1
        '400':
          description: The search request is invalid.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '401':
          description: The caller is not authenticated.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '403':
          description: The caller is not permitted to discover catalogue entries.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '429':
          description: The caller exceeded the applicable quota.
          headers:
            Retry-After:
              description: Number of seconds to wait before retrying.
              schema:
                type: integer
                minimum: 1
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '500':
          description: The catalogue search service failed.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
components:
  schemas:
    DocumentationSearchResponse:
      type: object
      additionalProperties: false
      required:
        - matches
        - returned
      properties:
        matches:
          type: array
          maxItems: 20
          items:
            $ref: '#/components/schemas/DocumentationMatch'
        returned:
          type: integer
          minimum: 0
          maximum: 20
          description: Number of documentation matches returned.
    DocumentationMatch:
      type: object
      additionalProperties: false
      required:
        - api_name
        - document_id
        - section_id
        - heading
        - excerpt
      properties:
        api_name:
          type: string
          description: API catalogue name.
        document_id:
          type: string
          description: Stable public identifier for the indexed document.
        section_id:
          type: string
          description: Stable identifier that can be used by a future section-retrieval tool.
        heading:
          type: string
          description: Documentation section heading.
        section_path:
          type: string
          description: Human-readable location within the documentation.
        excerpt:
          type: string
          maxLength: 4000
          description: Relevant documentation excerpt with unsafe markup removed.
        relevance:
          type: number
          format: float
          minimum: 0
          maximum: 1
          description: Relative search score for ordering results.
        portal_url:
          type: string
          format: uri
          description: Optional developer-portal URL; never a storage or internal repository URL.

    ApiCatalogueSearchResponse:
      type: object
      additionalProperties: false
      required:
        - apis
        - returned
      properties:
        apis:
          type: array
          maxItems: 10
          items:
            $ref: '#/components/schemas/ApiCatalogueEntry'
        returned:
          type: integer
          minimum: 0
          maximum: 10
    ApiCatalogueEntry:
      type: object
      additionalProperties: false
      required:
        - api_name
        - display_name
        - summary
        - version
        - lifecycle
      properties:
        api_name:
          type: string
          description: Stable API catalogue identifier.
        display_name:
          type: string
          description: Human-readable API name.
        summary:
          type: string
          maxLength: 500
          description: Concise description of the API capability.
        version:
          type: string
          description: Published API version.
        lifecycle:
          type: string
          enum: [active, beta, deprecated]
        documentation_url:
          type: string
          format: uri
          description: Optional public developer-portal URL.
    Problem:
      type: object
      additionalProperties: true
      required:
        - type
        - title
        - status
      properties:
        type:
          type: string
          format: uri-reference
        title:
          type: string
        status:
          type: integer
          minimum: 400
          maximum: 599
        detail:
          type: string
        correlation_id:
          type: string
          description: Safe identifier used to correlate platform logs.
